name: Linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - ">=2.16,<2.17"
          - ">=2.17,<2.18"
          - ">=2.19,<2.20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with pip
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core${{ matrix.ansible-core }}" jinja2 ansible-lint yamllint
      - run: "yamllint -s -f auto --list-files ."
        working-directory: ${{ github.workspace }}
      - run: "ansible-lint -v --force-color --profile production"
        working-directory: ${{ github.workspace }}
